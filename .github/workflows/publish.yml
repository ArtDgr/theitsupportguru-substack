name: publish-theitsupportguru

on:
  schedule:
    - cron: '0 18 * * 1'
    - cron: '0 18 * * 3'
    - cron: '0 18 * * 6'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Ingest RSS
        run: python src/ingest.py
      - name: Score relevance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/score.py
      - name: Enrich (Tavily)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python src/enrich.py
      - name: Synthesize draft (Neutral Analyst, AEST)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python src/synthesize.py
      - name: QA grounded check
        run: python src/qa.py
      - name: Publish (AEST jitter + Telegram gate)
        env:
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_PROFILE_IDS: ${{ secrets.BUFFER_PROFILE_IDS }}
          AYRSHARE_API_KEY: ${{ secrets.AYRSHARE_API_KEY }}
          AYRSHARE_PLATFORMS: ${{ secrets.AYRSHARE_PLATFORMS }}
          METRICOOL_MCP_ENABLED: ${{ secrets.METRICOOL_MCP_ENABLED }}
          CI: "1"
        run: python src/publish.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_id }}
          path: |
            out/
            drafts/
