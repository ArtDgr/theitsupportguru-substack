# .github/workflows/publish.yml - Fixed AEST UTC+10 year-round : 6:
# GitHub cron is UTC only. AEST = UTC+10 fixed.
# Target publish 06:12-06:27 AEST = 20:12-20:27 UTC prior day (jitter in publish.py)
# Ingest at 04:00 AEST = 18:00 UTC prior day -> jitter adds 2h12m-2h27m
name: publish-theitsupportguru

on:
  schedule:
    - cron: '0 18 * * 1' # Tue 06:00 AEST base (Mon 18:00 UTC) - Patch Brief
    - cron: '0 18 * * 3' # Thu 06:00 AEST base (Wed 18:00 UTC) - Threat Watch
    - cron: '0 18 * * 6' # Sun 06:00 AEST base (Sat 18:00 UTC) - Copilot Lab
  workflow_dispatch: # manual AEST test

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180 # includes 2h+ jitter sleep
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11', cache: 'pip'}
      - run: pip install -r requirements.txt
      - name: Ingest RSS
        run: python src/ingest.py
      - name: Score relevance
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o-mini' }}
        run: python src/score.py
      - name: Enrich (Tavily)
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: python src/enrich.py
      - name: Synthesize draft (Neutral Analyst, AEST)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ secrets.OPENAI_MODEL || 'gpt-4o' }}
        run: python src/synthesize.py
      - name: QA grounded check
        run: python src/qa.py
      - name: Publish (AEST jitter + Telegram gate)
        env:
          SUBSTACK_EMAIL: ${{ secrets.SUBSTACK_EMAIL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          AUTO_PUBLISH: ${{ secrets.AUTO_PUBLISH }} # 0 during 30d gate, 1 after
          CI: "1"
        run: python src/publish.py
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: draft-${{ github.run_id }}
          path: |
            out/
            drafts/
